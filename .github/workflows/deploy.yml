name: Deploy vinext blog to Server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment:
      name: Main-server
      url: https://mxte.cc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: |
          docker buildx build --platform linux/amd64 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t max/maxtune-blog \
            --output type=docker,dest=maxtune-blog.tar .

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Extract image
        run: |
          [ -d maxtune-blog ] || mkdir maxtune-blog
          tar -xf maxtune-blog.tar -C maxtune-blog

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: maxtune-blog
          path: ./maxtune-blog

  Deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: maxtune-blog
          path: ./maxtune-blog

      - name: Copy Docker image to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_PORT: ${{ secrets.SERVER_PORT }}
          ARGS: "-ravc -i --delete"
          SOURCE: "./maxtune-blog/"
          REMOTE_HOST: ${{ secrets.SERVER_ADDRESS }}
          REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
          TARGET: /tmp/maxtune-blog
          SCRIPT_BEFORE: |
            [ -d /tmp/maxtune-blog ] || mkdir /tmp/maxtune-blog
          SCRIPT_AFTER: |
            cd /tmp/maxtune-blog
            tar -cf maxtune-blog.tar *
            # Stop and remove existing container if it exists
            if [ "$(docker ps -aq -f name=maxtune-blog)" ]; then
              docker stop maxtune-blog
              docker rm maxtune-blog
            fi
            # Remove existing image if it exists
            if [ "$(docker images -q max/maxtune-blog)" ]; then
              docker rmi max/maxtune-blog
            fi
            docker load -i maxtune-blog.tar
            docker run --restart always -d --name maxtune-blog -p 4321:4321 max/maxtune-blog
